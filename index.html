<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aneeb Raza | Educator • Principal • Web Developer</title>

  <meta
    name="description"
    content="Aneeb Raza — Computer Science Educator, School Principal, Web Developer and Technology Professional."
  >

  <meta name="author" content="Aneeb Raza">

  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f7faff;
      color: #142033;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
    }

    :root {
      --navy: #061a35;
      --navy-light: #0d315d;
      --blue: #1769e8;
      --blue-light: #36a5ff;
      --cyan: #23c7ff;
      --white: #ffffff;
      --background: #f7faff;
      --text: #172033;
      --muted: #69788c;
      --border: #dfe8f2;
    }


    /* =========================================================
       PAGE LOADER
    ========================================================= */

    #loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .6s ease, visibility .6s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-content {
      text-align: center;
      color: white;
    }

    .loader-name {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 15px;
    }

    .loader-name span {
      color: var(--blue-light);
    }

    .loader-line {
      width: 150px;
      height: 3px;
      background: rgba(255,255,255,.15);
      overflow: hidden;
      border-radius: 20px;
    }

    .loader-line::after {
      content: "";
      display: block;
      width: 50%;
      height: 100%;
      background: var(--blue-light);
      animation: loader 1.1s infinite;
    }

    @keyframes loader {
      from {
        transform: translateX(-150%);
      }

      to {
        transform: translateX(300%);
      }
    }


    /* =========================================================
       NAVBAR
    ========================================================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 78px;
      z-index: 9000;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(218,228,240,.75);
      transition: .3s ease;
    }

    nav.scrolled {
      box-shadow: 0 8px 35px rgba(5,25,50,.08);
    }

    .nav-container {
      width: min(1200px, 100%);
      height: 100%;
      margin: auto;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--navy);
    }

    .logo span {
      color: var(--blue);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;
      list-style: none;
    }

    .nav-links a {
      position: relative;
      font-size: 13px;
      font-weight: 750;
      color: #45566d;
      transition: .3s;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0;
      height: 2px;
      background: var(--blue);
      transition: .3s;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      padding: 10px 17px;
      border-radius: 8px;
      color: white !important;
      background: var(--navy);
    }

    .nav-cta::after {
      display: none;
    }

    .nav-cta:hover {
      background: var(--blue);
    }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      font-size: 27px;
      color: var(--navy);
      cursor: pointer;
    }


    /* =========================================================
       MOBILE NAVIGATION
    ========================================================= */

    .mobile-menu {
      display: none;
      position: absolute;
      top: 78px;
      left: 0;
      width: 100%;
      padding: 20px;
      background: white;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 15px 35px rgba(5,25,50,.10);
    }

    .mobile-menu.active {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 13px 10px;
      color: var(--navy);
      font-size: 14px;
      font-weight: 750;
      border-bottom: 1px solid #edf2f7;
    }

    .mobile-menu a:last-child {
      border-bottom: none;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;
      min-height: 100vh;
      padding: 150px 25px 100px;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(23,105,232,.16),
          transparent 28%
        ),

        radial-gradient(
          circle at 15% 75%,
          rgba(35,199,255,.09),
          transparent 25%
        ),

        linear-gradient(
          135deg,
          #ffffff 0%,
          #f5f9ff 55%,
          #eaf3ff 100%
        );
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(23,105,232,.035) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(23,105,232,.035) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent
        );

      pointer-events: none;
    }


    /* =========================================================
       FLOATING ORBS
    ========================================================= */

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      pointer-events: none;
      animation: floating 7s ease-in-out infinite;
    }

    .orb.one {
      width: 18px;
      height: 18px;
      background: var(--blue);
      top: 22%;
      left: 8%;
      box-shadow: 0 0 30px rgba(23,105,232,.35);
    }

    .orb.two {
      width: 11px;
      height: 11px;
      background: var(--cyan);
      top: 30%;
      right: 13%;
      animation-delay: 1s;
    }

    .orb.three {
      width: 14px;
      height: 14px;
      background: #6d7cff;
      bottom: 22%;
      right: 38%;
      animation-delay: 2s;
    }

    @keyframes floating {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-18px);
      }
    }


    .hero-container {
      position: relative;
      z-index: 5;

      width: min(1200px, 100%);
      margin: auto;

      display: grid;

      grid-template-columns:
        minmax(0, 1.12fr)
        minmax(370px, .88fr);

      gap: 75px;
      align-items: center;
    }


    /* =========================================================
       HERO CONTENT
    ========================================================= */

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 8px 14px;
      margin-bottom: 25px;

      border-radius: 50px;

      background: rgba(23,105,232,.07);
      border: 1px solid rgba(23,105,232,.14);

      color: var(--blue);

      font-size: 12px;
      font-weight: 850;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #20b875;
      box-shadow: 0 0 0 5px rgba(32,184,117,.10);
    }

    .hero h1 {
      font-size: clamp(54px, 7vw, 88px);
      line-height: .95;
      letter-spacing: -5px;
      color: var(--navy);
      margin-bottom: 27px;
    }

    .hero h1 span {
      color: var(--blue);
      position: relative;
    }

    .hero h1 span::after {
      content: "";
      position: absolute;
      left: 4px;
      right: 0;
      bottom: -8px;
      height: 5px;
      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--cyan)
        );

      opacity: .75;
    }

    .hero-subtitle {
      max-width: 720px;
      font-size: 24px;
      line-height: 1.4;
      font-weight: 750;
      color: var(--navy-light);
      margin-bottom: 20px;
    }

    .hero-subtitle span {
      color: var(--blue);
    }

    .hero-description {
      max-width: 700px;
      font-size: 16px;
      line-height: 1.85;
      color: var(--muted);
      margin-bottom: 32px;
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-bottom: 35px;
    }

    .btn {
      min-height: 52px;
      padding: 0 23px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 9px;

      font-size: 13px;
      font-weight: 850;

      transition:
        transform .3s,
        box-shadow .3s,
        background .3s;
    }

    .btn-primary {
      color: white;

      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--blue)
        );

      box-shadow:
        0 12px 30px rgba(23,105,232,.22);
    }

    .btn-primary:hover {
      transform: translateY(-3px);

      box-shadow:
        0 17px 38px rgba(23,105,232,.32);
    }

    .btn-secondary {
      color: var(--navy);
      background: white;
      border: 1px solid #ccd8e6;
    }

    .btn-secondary:hover {
      color: var(--blue);
      border-color: var(--blue);
      transform: translateY(-3px);
    }


    /* =========================================================
       SOCIALS
    ========================================================= */

    .social-area {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .social-title {
      margin-right: 5px;
      color: #8592a4;
      font-size: 12px;
      font-weight: 800;
    }

    .social {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 9px;

      background: white;
      border: 1px solid var(--border);

      color: var(--navy);

      font-size: 12px;
      font-weight: 900;

      transition: .3s;
    }

    .social:hover {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
      transform: translateY(-3px);

      box-shadow:
        0 8px 20px rgba(23,105,232,.22);
    }


    /* =========================================================
       PROFILE CARD
    ========================================================= */

    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .visual-ring {
      position: absolute;

      width: 440px;
      height: 440px;

      border-radius: 50%;

      border:
        1px solid rgba(23,105,232,.13);

      animation:
        rotate-ring 20s linear infinite;
    }

    .visual-ring::before {
      content: "";

      position: absolute;

      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: var(--blue);

      top: 25px;
      left: 85px;

      box-shadow:
        0 0 25px rgba(23,105,232,.6);
    }

    @keyframes rotate-ring {
      from {
        transform: rotate(0);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .profile-card {
      position: relative;

      width: 380px;
      padding: 30px;

      border-radius: 25px;

      background:
        rgba(255,255,255,.82);

      border:
        1px solid rgba(255,255,255,.95);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 30px 80px rgba(5,25,50,.14);

      text-align: center;

      z-index: 5;

      animation:
        cardFloat 6s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }

    .profile-photo {
      display: block !important;

      width: 215px !important;
      height: 215px !important;

      min-width: 215px !important;
      min-height: 215px !important;

      max-width: 215px !important;
      max-height: 215px !important;

      margin: 0 auto 22px !important;

      padding: 0 !important;

      border-radius: 50% !important;

      object-fit: cover !important;
      object-position: center center !important;

      border: 5px solid #ffffff !important;

      box-shadow:
        0 16px 40px rgba(5,25,50,.20) !important;

      background: #eaf2fb !important;
      overflow: hidden !important;
    }

    .profile-card h2 {
      color: var(--navy);
      font-size: 25px;
      margin-bottom: 4px;
    }

    .profile-card > p {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 20px;
    }

    .profile-divider {
      width: 55px;
      height: 3px;
      margin: 0 auto 17px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--cyan)
        );
    }

    .profile-tagline {
      color: var(--navy-light);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.2px;
    }


    /* =========================================================
       FLOATING LABELS
    ========================================================= */

    .floating-label {
      position: absolute;
      z-index: 10;

      padding: 11px 15px;

      border-radius: 11px;

      background: rgba(255,255,255,.9);

      border:
        1px solid rgba(220,230,240,.9);

      box-shadow:
        0 12px 30px rgba(5,25,50,.10);

      color: var(--navy);

      font-size: 11px;
      font-weight: 850;

      backdrop-filter: blur(12px);

      animation:
        labelFloat 5s ease-in-out infinite;
    }

    .label-one {
      top: 8%;
      right: -25px;
    }

    .label-two {
      bottom: 9%;
      left: -25px;
      animation-delay: 1.5s;
    }

    @keyframes labelFloat {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }


    /* =========================================================
       STATS
    ========================================================= */

    .stats-wrapper {
      position: relative;
      z-index: 50;

      width: min(1150px, 100%);

      margin: -42px auto 0;
      padding: 0 25px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);

      background: white;

      border:
        1px solid var(--border);

      border-radius: 18px;

      box-shadow:
        0 20px 55px rgba(5,25,50,.09);

      overflow: hidden;
    }

    .stat {
      padding: 24px 15px;
      text-align: center;

      border-right:
        1px solid var(--border);
    }

    .stat:last-child {
      border-right: none;
    }

    .stat strong {
      display: block;
      color: var(--navy);
      font-size: 18px;
      margin-bottom: 3px;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }


    /* =========================================================
       INTRO / ABOUT
    ========================================================= */

    .intro {
      padding: 120px 25px;
      background: white;
    }

    .intro-container {
      width: min(1150px,100%);
      margin: auto;

      display: grid;

      grid-template-columns:
        .85fr 1.15fr;

      gap: 70px;
      align-items: center;
    }

    .section-label {
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 13px;
    }

    .intro h2 {
      color: var(--navy);
      font-size: 43px;
      line-height: 1.12;
      letter-spacing: -1.5px;
      margin-bottom: 20px;
    }

    .intro p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.85;
      margin-bottom: 13px;
    }

    .focus-card {
      padding: 35px;
      border-radius: 21px;
      color: white;

      background:
        linear-gradient(
          135deg,
          #061a35,
          #0b3c73
        );

      box-shadow:
        0 25px 55px rgba(5,25,50,.16);
    }

    .focus-card h3 {
      font-size: 22px;
      margin-bottom: 22px;
    }

    .focus-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .focus-item {
      padding: 13px;

      border:
        1px solid rgba(255,255,255,.12);

      background:
        rgba(255,255,255,.06);

      border-radius: 9px;

      font-size: 12px;
      font-weight: 750;
    }


    /* =========================================================
       EXPERIENCE
    ========================================================= */

      padding: 110px 25px;
      background: #f7faff;
    }

    .experience-container {
      width: min(1150px,100%);
      margin: auto;
    }

    .section-heading {
      max-width: 700px;
      margin-bottom: 45px;
    }

    .section-heading h2 {
      color: var(--navy);
      font-size: 43px;
      line-height: 1.12;
      letter-spacing: -1.5px;
      margin-bottom: 15px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .experience-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }

    .experience-card {
      padding: 30px;
      background: white;
      border: 1px solid var(--border);

      box-shadow:
        0 15px 40px rgba(5,25,50,.06);

      transition: .3s;
    }

    .experience-card:hover {
      transform: translateY(-7px);

      box-shadow:
        0 25px 55px rgba(5,25,50,.11);
    }

    .experience-icon {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;

      border-radius: 12px;

    }

    .experience-card h3 {
      color: var(--navy);
      font-size: 19px;
      margin-bottom: 10px;
    }

    .experience-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }


    /* =========================================================
       SKILLS
    ========================================================= */

    .skills {
      padding: 110px 25px;
      background: white;
    }

    .skills-container {
      width: min(1150px,100%);
      margin: auto;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 20px;
    }

      padding: 28px;

      border-radius: 17px;

      background: #fbfdff;

      transition: .3s;
    }

      border-color: #bcd5f5;
