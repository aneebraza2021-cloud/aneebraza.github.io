<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aneeb Raza | Educator • Principal • Web Developer</title>

  <meta name="description" content="Aneeb Raza — Educator, Principal, Computer Science Teacher and Web Developer.">
  <meta name="author" content="Aneeb Raza">

  <style>
    :root {
      --navy: #061a35;
      --navy-light: #0d315d;
      --blue: #1769e8;
      --blue-light: #36a5ff;
      --white: #ffffff;
      --background: #f7faff;
      --text: #172033;
      --muted: #69788c;
      --border: #dfe8f2;
      --success: #20b875;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       LOADER
    ========================= */

    #loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-content {
      text-align: center;
      color: white;
    }

    .loader-name {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .loader-name span {
      color: var(--blue-light);
    }

    .loader-line {
      width: 150px;
      height: 3px;
      background: rgba(255,255,255,0.15);
      overflow: hidden;
      border-radius: 20px;
    }

    .loader-line::after {
      content: "";
      display: block;
      width: 50%;
      height: 100%;
      background: var(--blue-light);
      animation: loader 1.1s infinite;
    }

    @keyframes loader {
      from {
        transform: translateX(-150%);
      }

      to {
        transform: translateX(300%);
      }
    }

    /* =========================
       NAVIGATION
    ========================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 78px;
      z-index: 9000;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(218,228,240,0.75);
      transition: 0.3s ease;
    }

    nav.scrolled {
      box-shadow: 0 8px 35px rgba(5,25,50,0.08);
    }

    .nav-container {
      width: min(1200px, 100%);
      height: 100%;
      margin: auto;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      color: var(--navy);
    }

    .logo span {
      color: var(--blue);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;
      list-style: none;
    }

    .nav-links a {
      position: relative;
      font-size: 13px;
      font-weight: 700;
      color: #45566d;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0;
      height: 2px;
      background: var(--blue);
      transition: 0.3s;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      padding: 10px 17px;
      border-radius: 8px;
      color: white !important;
      background: var(--navy);
    }

    .nav-cta:hover {
      background: var(--blue);
    }

    .nav-cta::after {
      display: none;
    }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      font-size: 27px;
      color: var(--navy);
      cursor: pointer;
    }

    .mobile-menu {
      display: none;
      position: absolute;
      top: 78px;
      left: 0;
      width: 100%;
      padding: 20px;
      background: white;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 15px 35px rgba(5,25,50,0.10);
    }

    .mobile-menu.active {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 13px 10px;
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid #edf2f7;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      min-height: 100vh;
      padding: 150px 25px 100px;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(23,105,232,0.16),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f5f9ff 55%,
          #eaf3ff 100%
        );
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(23,105,232,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23,105,232,0.035) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    .hero-container {
      position: relative;
      z-index: 5;
      width: min(1200px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: 75px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      margin-bottom: 25px;
      border-radius: 50px;
      background: rgba(23,105,232,0.07);
      border: 1px solid rgba(23,105,232,0.14);
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(32,184,117,0.10);
    }

    .hero h1 {
      font-size: clamp(54px, 7vw, 88px);
      line-height: 0.95;
      letter-spacing: -5px;
      color: var(--navy);
      margin-bottom: 27px;
    }

    .hero h1 span {
      color: var(--blue);
    }

    .hero-subtitle {
      max-width: 720px;
      font-size: 24px;
      line-height: 1.4;
      font-weight: 750;
      color: var(--navy-light);
      margin-bottom: 20px;
    }

    .hero-subtitle span {
      color: var(--blue);
    }

    .hero-description {
      max-width: 700px;
      font-size: 16px;
      line-height: 1.85;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-bottom: 35px;
    }

    .btn {
      min-height: 52px;
      padding: 0 23px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 800;
      transition: 0.3s;
    }

    .btn-primary {
      color: white;
      background: var(--blue);
      box-shadow: 0 12px 30px rgba(23,105,232,0.22);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 17px 38px rgba(23,105,232,0.32);
    }

    .btn-secondary {
      color: var(--navy);
      background: white;
      border: 1px solid #ccd8e6;
    }

    .btn-secondary:hover {
      color: var(--blue);
      border-color: var(--blue);
      transform: translateY(-3px);
    }

    /* =========================
       SOCIAL
    ========================= */

    .social-area {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .social-title {
      margin-right: 5px;
      color: #8592a4;
      font-size: 12px;
      font-weight: 800;
    }

    .social {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      background: white;
      border: 1px solid var(--border);
      color: var(--navy);
      font-size: 11px;
      font-weight: 900;
      transition: 0.3s;
    }

    .social:hover {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
      transform: translateY(-3px);
    }

    /* =========================
       PROFILE CARD
    ========================= */

    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .visual-ring {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      border: 1px dashed rgba(23,105,232,0.25);
      animation: rotate-ring 20s linear infinite;
    }

    .visual-ring::before {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--blue);
      top: 25px;
      left: 85px;
      box-shadow: 0 0 25px rgba(23,105,232,0.6);
    }

    @keyframes rotate-ring {
      from {
        transform: rotate(0);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .profile-card {
      position: relative;
      width: 380px;
      padding: 30px;
      border-radius: 25px;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(5,25,50,0.14);
      text-align: center;
      z-index: 5;
      animation: cardFloat 6s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }

    .profile-photo {
      display: block;
      width: 215px;
      height: 215px;
      margin: 0 auto 22px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      border: 5px solid white;
      box-shadow: 0 16px 40px rgba(5,25,50,0.20);
      background: #eaf2fb;
    }

    .profile-card h2 {
      color: var(--navy);
      font-size: 25px;
      margin-bottom: 4px;
    }

    .profile-card > p {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 20px;
    }

    .profile-divider {
      width: 55px;
      height: 3px;
      margin: 0 auto 17px;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--blue), var(--blue-light));
    }

    .profile-tagline {
      color: var(--navy-light);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.2px;
    }

    .floating-label {
      position: absolute;
      z-index: 10;
      padding: 11px 15px;
      border-radius: 11px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(220,230,240,0.9);
      box-shadow: 0 12px 30px rgba(5,25,50,0.10);
      color: var(--navy);
      font-size: 11px;
      font-weight: 850;
      backdrop-filter: blur(12px);
      animation: labelFloat 5s ease-in-out infinite;
    }

    .label-one {
      top: 8%;
      right: -25px;
    }

    .label-two {
      bottom: 9%;
      left: -25px;
      animation-delay: 1.5s;
    }

    @keyframes labelFloat {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* =========================
       STATS
    ========================= */

    .stats-wrapper {
      position: relative;
      z-index: 50;
      width: min(1150px,100%);
      margin: -42px auto 0;
      padding: 0 25px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 55px rgba(5,25,50,0.09);
      overflow: hidden;
    }

    .stat {
      padding: 24px 15px;
      text-align: center;
      border-right: 1px solid var(--border);
    }

    .stat:last-child {
      border-right: none;
    }

    .stat strong {
      display: block;
      color: var(--navy);
      font-size: 18px;
      margin-bottom: 3px;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================
       ABOUT
    ========================= */

    .intro {
      padding: 120px 25px;
      background: white;
    }

    .intro-container {
      width: min(1150px,100%);
      margin: auto;
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 70px;
      align-items: center;
    }

    .section-label {
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 13px;
    }

    .intro h2,
    .section-heading h2 {
      color: var(--navy);
      font-size: 43px;
      line-height: 1.12;
      letter-spacing: -1.5px;
      margin-bottom: 20px;
    }

    .intro p,
    .section-heading p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.85;
      margin-bottom: 13px;
    }

    .focus-card {
      padding: 35px;
      border-radius: 21px;
      color: white;
      background: linear-gradient(135deg, #061a35, #0e477f);
      box-shadow: 0 25px 55px rgba(5,25,50,0.16);
    }

    .focus-card h3 {
      font-size: 22px;
      margin-bottom: 22px;
    }

    .focus-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .focus-item {
      padding: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 9px;
      font-size: 12px;
      font-weight: 750;
    }

    /* =========================
       EXPERIENCE
    ========================= */

    .experience {
      padding: 110px 25px;
      background: #f7faff;
    }

    .experience-container {
      width: min(1150px,100%);
      margin: auto;
    }

    .section-heading {
      max-width: 700px;
      margin-bottom: 45px;
    }

    .experience-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }

    .experience-card {
      padding: 30px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(5,25,50,0.06);
      transition: 0.3s;
    }

    .experience-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 25px 55px rgba(5,25,50,0.11);
    }

    .experience-icon {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      border-radius: 12px;
      background: #edf5ff;
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .experience-card h3 {
      color: var(--navy);
      font-size: 19px;
      margin-bottom: 10px;
    }

    .experience-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    /* =========================
       SKILLS
    ========================= */

    .skills {
      padding: 110px 25px;
      background: white;
    }

    .skills-container {
      width: min(1150px,100%);
      margin: auto;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }

    .skill-box {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: #fbfdff;
      transition: 0.3s;
    }

    .skill-box:hover {
      border-color: #bcd5f5;
      transform: translateY(-4px);
    }

    .skill-box h3 {
      color: var(--navy);
      font-size: 17px;
      margin-bottom: 8px;
    }

    .skill-box p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       CONTACT
    ========================= */

    .contact {
      padding: 100px 25px;
      background: #f2f7fd;
    }

    .contact-box {
      width: min(1000px,100%);
      margin: auto;
      padding: 55px;
      border-radius: 23px;
      color: white;
      background: linear-gradient(135deg, #061a35, #0e477f);
      text-align: center;
      box-shadow: 0 25px 55px rgba(5,25,50,0.16);
    }

    .contact-box h2 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .contact-box p {
      max-width: 650px;
      margin: 0 auto 28px;
      color: #c6d6e8;
      font-size: 14px;
    }

    .email-button {
      background: white;
      color: var(--navy);
    }

    .email-button:hover {
      background: var(--blue);
      color: white;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 28px 20px;
      text-align: center;
      background: #031226;
      color: #899bb1;
      font-size: 12px;
    }

    footer strong {
      color: white;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width: 950px) {

      .nav-links {
        display: none;
      }

      .menu-button {
        display: block;
      }

      .hero-container {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 65px;
      }

      .hero-description {
        margin-left: auto;
        margin-right: auto;
      }

      .hero-buttons,
      .social-area {
        justify-content: center;
      }

      .hero-visual {
        order: 2;
      }

      .intro-container {
        grid-template-columns: 1fr;
      }

      .experience-grid,
      .skills-grid {
        grid-template-columns: 1fr 1fr;
      }

      .stats {
        grid-template-columns: repeat(2,1fr);
      }

      .stat:nth-child(2) {
        border-right: none;
      }

      .stat:nth-child(-n+2) {
        border-bottom: 1px solid var(--border);
      }
    }

    @media(max-width: 600px) {

      nav {
        height: 70px;
      }

      .mobile-menu {
        top: 70px;
      }

      .hero {
        padding: 125px 20px 90px;
      }

      .hero h1 {
        font-size: 54px;
        letter-spacing: -3px;
      }

      .hero-subtitle {
        font-size: 20px;
      }

      .hero-description {
        font-size: 14px;
      }

      .profile-card {
        width: 100%;
        max-width: 340px;
        padding: 25px;
      }

      .profile-photo {
        width: 190px;
        height: 190px;
      }

      .visual-ring {
        width: 320px;
        height: 320px;
      }

      .floating-label {
        display: none;
      }

      .stats-wrapper {
        padding: 0 15px;
        margin-top: -30px;
      }

      .intro,
      .experience,
      .skills,
      .contact {
        padding: 80px 20px;
      }

      .intro h2,
      .section-heading h2 {
        font-size: 34px;
      }

      .focus-grid {
        grid-template-columns: 1fr;
      }

      .experience-grid,
      .skills-grid {
        grid-template-columns: 1fr;
      }

      .contact-box {
        padding: 40px 22px;
      }

      .contact-box h2 {
        font-size: 30px;
      }

      .btn {
        width: 100%;
      }

      .hero-buttons {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- LOADER -->
  <div id="loader">
    <div class="loader-content">
      <div class="loader-name">Aneeb <span>Raza</span></div>
      <div class="loader-line"></div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav id="navbar">
    <div class="nav-container">

      <a href="#home" class="logo">
        ANEEB<span>RAZA</span>
      </a>

      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact" class="nav-cta">Contact</a></li>
      </ul>

      <button class="menu-button" id="menuButton" aria-label="Open menu">
        ☰
      </button>
    </div>

    <div class="mobile-menu" id="mobileMenu">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#experience">Experienc
